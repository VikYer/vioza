{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vioza | {% block title%}{{title}}{% endblock %}</title>

    <!-- Bootstrap css -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="{% static 'bootstrap-icons/bootstrap-icons.min.css' %}">

    <!-- CSS -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

<!-- Header -->
<header class="container-fluid">
    {% include "core/includes/_navbar.html" %}
</header>

<!-- Content -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="container-fluid">
    {% include "core/includes/_footer.html" %}
</footer>

<!-- Bootstrap scrip -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const cards = document.querySelectorAll('.category-card');
    const container = document.getElementById('subcategory-container');
    const row = document.getElementById('subcategory-row');
    const title = document.getElementById('subcategory-title');

    let activeCategory = null;

    cards.forEach(card => {
        card.addEventListener('click', (event) => {
            // Prevent click from bubbling to document
            event.stopPropagation();

            const categoryId = card.dataset.categoryId;
            const categoryTitle = card.dataset.categoryTitle;

            // Toggle: close if the same category is clicked again
            if (activeCategory === categoryId) {
                closePanel();
                return;
            }

            activeCategory = categoryId;

            fetch(`/ajax/subcategories/${categoryId}/`)
                .then(response => response.json())
                .then(data => {

                    row.innerHTML = '';

                    // Category title as a link
                    title.innerHTML = `
                        <a href="#" class="text-decoration-none">
                            All in ${categoryTitle}
                        </a>
                    `;

                    // Subcategories grid
                    data.subcategories.forEach(sub => {
                        row.innerHTML += `
                            <div class="col-md-4 col-lg-3 mb-2">
                                <a href="#" class="list-group-item">
                                    ${sub.title}
                                </a>
                            </div>
                        `;
                    });

                    container.classList.remove('d-none');
                    container.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                });
        });
    });

    // Click outside categories or subcategory panel closes the panel
    document.addEventListener('click', (event) => {
        if (
            !container.contains(event.target) &&
            !event.target.closest('.category-card')
        ) {
            closePanel();
        }
    });

    function closePanel() {
        container.classList.add('d-none');
        row.innerHTML = '';
        activeCategory = null;
    }

});
</script>

</body>

</html>
