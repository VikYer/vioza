{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <h4 class="card-header">{{ title }}</h4>
                <form action="#" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="card-body">
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
