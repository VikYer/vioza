<div class="container">
    <div class="row row-cols-2 row-cols-md-6 row-cols-lg-8 row-cols-xl-12 justify-content-center">
        {% for category in categories %}
        <div class="col text-center">

            <div class="card mb-3 category-card"
                 data-category-id="{{ category.id }}"
                 data-subcategories='[
                    {% for sub in category.subcategories.all %}
                        {"id": "{{ sub.id }}", "title": "{{ sub.title }}"}{% if not forloop.last %},{% endif %}
                    {% endfor %}
                 ]'>
                {% if category.icon %}
                <img src="{{ category.icon.url }}" alt="{{ category }}">
                {% endif %}
                <div class="card-body">
                    <p class="card-text">{{ category }}</p>
                </div>
            </div>

        </div>
        {% endfor %}
    </div>
</div>

<div class="container mt-4">
    <div id="subcategory-container" class="d-none">
        <div class="row" id="subcategory-row"></div>
    </div>
</div>
